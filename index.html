<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Shelf — Digital Library Catalog</title>
  <meta name="description" content="Open Shelf: browse, search and save books from a digital library catalog.">
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
  <script src="search.js" defer></script>
</head>
<body data-page="home">
  <div class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar">
      <a class="brand" href="index.html">
        <svg class="logo" viewBox="0 0 36 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6C13 2 6 2 2 4v22c4-2 11-2 16 2 5-4 12-4 16-2V4c-4-2-11-2-16 2z"/><path d="M18 6v22"/>
        </svg>
        Open Shelf
      </a>

      <nav class="side-nav" aria-label="Main">
        <ul>
          <li>
            <a href="index.html" aria-current="page">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></svg>
              Home
            </a>
          </li>
          <li>
            <a href="#featured">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
              Browse Books
            </a>
          </li>
          <li>
            <a href="#categories">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>
              Categories
            </a>
          </li>
          <li>
            <a href="login.html">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
              My Reading List
            </a>
          </li>
        </ul>
      </nav>

      <!-- Decorative shelf -->
      <div class="mini-shelf shelf" aria-hidden="true">
        <span class="book b4"></span>
        <span class="book b3"></span>
        <span class="book b2"></span>
        <svg class="plant" viewBox="0 0 90 110">
          <g fill="#4f8a4a">
            <path d="M45 75C44 55 40 35 30 15" stroke="#3a6b3a" stroke-width="2" fill="none"/>
            <path d="M46 75C50 55 58 40 72 28" stroke="#3a6b3a" stroke-width="2" fill="none"/>
            <ellipse cx="30" cy="18" rx="7" ry="12" transform="rotate(-30 30 18)"/>
            <ellipse cx="36" cy="42" rx="6" ry="11" transform="rotate(-60 36 42)"/>
            <ellipse cx="58" cy="44" rx="6" ry="11" transform="rotate(50 58 44)"/>
            <ellipse cx="70" cy="28" rx="7" ry="12" transform="rotate(40 70 28)"/>
            <ellipse cx="52" cy="22" rx="5" ry="10" fill="#6aa35f"/>
          </g>
          <path d="M26 74h38l-5 34H31z" fill="#e9d7b5"/>
          <rect x="24" y="70" width="42" height="8" rx="2" fill="#d8c19a"/>
        </svg>
      </div>
    </aside>

    <!-- ===== Main column ===== -->
    <div class="main">

      <header class="topbar">
        <!-- Search: search.js sends this to GET /api/books?q=… without reloading the page -->
        <form class="search" action="#featured" role="search" novalidate>
          <div class="search-field">
            <label for="search-input" class="visually-hidden">Search by title or author</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
            <input id="search-input" type="search" placeholder="Search by title or author…" maxlength="200" autocomplete="off" spellcheck="false" aria-controls="book-results">
          </div>
          <button class="btn btn-primary" type="submit">Search</button>
        </form>

        <!-- Signed out -->
        <div class="top-actions" data-auth-when="signed-out">
          <a class="top-link" href="login.html" data-auth-action="login">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
            Log In
          </a>
          <a class="btn btn-accent" href="register.html" data-auth-action="register">Sign Up</a>
        </div>

        <!-- Signed in -->
        <div class="top-actions" data-auth-when="signed-in" hidden>
          <span class="user-chip">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>
            <span class="visually-hidden">Signed in as</span>
            <span class="user-email" data-auth-field="email"></span>
          </span>
          <button class="btn btn-outline" type="button" data-auth-action="logout">Log Out</button>
        </div>
      </header>

      <p class="auth-message topbar-message" data-auth-message role="alert" hidden></p>

      <main>
        <!-- ===== Hero ===== -->
        <section class="hero" aria-labelledby="hero-title">
          <div>
            <h1 id="hero-title">Your next chapter <span class="accent">starts here.</span></h1>
            <p>Discover, explore, and save books you'll love.</p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="#featured">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6C9 4 5 4 2 5v14c3-1 7-1 10 1 3-2 7-2 10-1V5c-3-1-7-1-10
