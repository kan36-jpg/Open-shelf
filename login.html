<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This page is the Cognito callback: don't leak ?code= in Referer headers -->
  <meta name="referrer" content="no-referrer">
  <title>Log In — Open Shelf</title>
  <link rel="stylesheet" href="styles.css">
  <script src="auth.js" defer></script>
</head>
<body data-page="login">
  <header class="auth-header">
    <a class="brand" href="index.html">
      <svg class="logo" viewBox="0 0 36 30" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 6C13 2 6 2 2 4v22c4-2 11-2 16 2 5-4 12-4 16-2V4c-4-2-11-2-16 2z"/><path d="M18 6v22"/>
      </svg>
      Open Shelf
    </a>
  </header>

  <main class="auth-stage">
    <!-- Decorative stack, left -->
    <div class="deco deco-left" aria-hidden="true">
      <div class="book-stack">
        <span class="book-flat f3"></span>
        <span class="book-flat f2"></span>
        <span class="book-flat"></span>
      </div>
    </div>

    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title">Log In to Open Shelf</h1>

      <p class="auth-message" data-auth-message role="alert" hidden></p>

      <noscript>
        <p class="auth-message">JavaScript is required to sign in. You can still browse as a guest.</p>
      </noscript>

      <!-- Shown while the authorization code is being exchanged -->
      <div class="auth-status" data-auth-when="processing" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        Signing you in…
      </div>

      <!-- Signed out -->
      <div data-auth-when="signed-out">
        <p class="auth-lead">
          You'll sign in on Open Shelf's secure sign-in page, hosted by Amazon Cognito.
          Your password is entered there — never on this site.
        </p>

        <a class="btn btn-primary btn-block" href="login.html" data-auth-action="login">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
          Log In
        </a>

        <div class="divider">or</div>

        <a class="btn btn-outline-accent btn-block" href="index.html#featured">Continue as Guest</a>

        <p class="switch-auth">Don't have an account? <a href="register.html" data-auth-action="register">Create an account</a></p>
      </div>

      <!-- Signed in -->
      <div data-auth-when="signed-in" hidden>
        <p class="auth-lead">You're signed in as <strong data-auth-field="email"></strong>.</p>

        <a class="btn btn-primary btn-block" href="index.html#featured">Browse the Catalog</a>

        <div class="divider">or</div>

        <button class="btn btn-outline-accent btn-block" type="button" data-auth-action="logout">Log Out</button>
      </div>
    </section>

    <!-- Decorative stack + plant, right -->
    <div class="deco deco-right" aria-hidden="true">
      <div class="book-stack">
        <span class="book-flat"></span>
        <span class="book-flat f2"></span>
        <span class="book-flat f3"></span>
      </div>
      <svg class="plant" viewBox="0 0 90 110">
        <g fill="#4f8a4a">
          <path d="M45 75C44 55 40 35 30 15" stroke="#3a6b3a" stroke-width="2" fill="none"/>
          <path d="M46 75C50 55 58 40 72 28" stroke="#3a6b3a" stroke-width="2" fill="none"/>
          <ellipse cx="30" cy="18" rx="7" ry="12" transform="rotate(-30 30 18)"/>
          <ellipse cx="36" cy="42" rx="6" ry="11" transform="rotate(-60 36 42)"/>
          <ellipse cx="58" cy="44" rx="6" ry="11" transform="rotate(50 58 44)"/>
          <ellipse cx="70" cy="28" rx="7" ry="12" transform="rotate(40 70 28)"/>
          <ellipse cx="52" cy="22" rx="5" ry="10" fill="#6aa35f"/>
        </g>
        <path d="M26 74h38l-5 34H31z" fill="#e9d7b5"/>
        <rect x="24" y="70" width="42" height="8" rx="2" fill="#d8c19a"/>
      </svg>
    </div>
  </main>
</body>
</html>
